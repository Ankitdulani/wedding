<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer with Status</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script nomodule src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js"></script>
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #f0f0f0; }
        model-viewer {
            width: 80%;
            height: 80%;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        #ar-button {
            background-image: url("https://modelviewer.dev/shared-assets/icons/ic_view_in_ar_new_googblue_48dp.png");
            background-repeat: no-repeat;
            background-size: 20px 20px;
            background-position: 10% 50%;
            background-color: #fff;
            position: absolute;
            bottom: 16px;
            right: 16px;
            border-radius: 4px;
            border: none;
            padding: 8px 16px 8px 36px;
            cursor: pointer;
            outline: none;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        #ar-status {
            position: absolute;
            top: 16px;
            left: 16px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Roboto', sans-serif;
            font-size: 12px;
            display: none; /* Hidden by default */
        }
        .glowing-text {
            font-family: 'Arial', sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #fff; /* Base color for the text */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.7), /* Initial subtle glow */
                         0 0 10px rgba(0, 255, 255, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent background for readability */
            animation: glow-animation 2s infinite alternate ease-in-out; /* Apply the glow animation */
        }

        /* Keyframes for the glowing animation */
        @keyframes glow-animation {
            from {
                text-shadow: 0 0 5px rgba(0, 255, 255, 0.7),
                             0 0 10px rgba(0, 255, 255, 0.5);
                box-shadow: 0 0 5px rgba(0, 255, 255, 0.4); /* Optional: box shadow for the background */
            }
            to {
                text-shadow: 0 0 15px rgba(0, 255, 255, 1), /* Brighter glow */
                             0 0 25px rgba(0, 255, 255, 0.8),
                             0 0 40px rgba(0, 255, 255, 0.6);
                box-shadow: 0 0 10px rgba(0, 255, 255, 0.6), /* Optional: stronger box shadow */
                            0 0 20px rgba(0, 255, 255, 0.4);
            }
        }
    </style>
</head>
<body>
    <model-viewer
        id="my-model-viewer"
        src="weddingScene.glb"
        ios-src="weddingScene.usdz"
        alt="A 3D model of an astronaut"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        autoplay
        animation-name="Running"
        shadow-intensity="1"
        <div class="glowing-text" slot="hotspot-1" data-position="0 1.5 0" data-normal="0 1 0">
                You are invits to our wedding</div>
        <button slot="ar-button" id="ar-button">
            View in your space
        </button>
    </model-viewer>

    <div id="ar-status"></div>

    <script>
        const modelViewer = document.querySelector('#my-model-viewer');
        const arStatusDiv = document.querySelector('#ar-status');

        if (modelViewer) {
            modelViewer.addEventListener('ar-status', (event) => {
                const status = event.detail.status;
                const error = event.detail.error;
                arStatusDiv.style.display = 'block';

                if (status === 'not-presenting') {
                    arStatusDiv.textContent = 'AR experience not active.';
                } else if (status === 'presenting') {
                    arStatusDiv.textContent = 'AR experience active.';
                } else if (status === 'failed') {
                    arStatusDiv.textContent = `AR failed: ${error}`;
                } else if (status === 'session-started') {
                    arStatusDiv.textContent = 'AR session started.';
                } else if (status === 'session-ended') {
                    arStatusDiv.textContent = 'AR session ended.';
                } else if (status === 'unsupported') {
                    arStatusDiv.textContent = 'AR not supported on this device/browser.';
                    // You might want to hide the AR button if completely unsupported
                    document.getElementById('ar-button').style.display = 'none';
                }
                // You can log other statuses like 'initialization-started', 'tracking', etc.
                console.log('AR Status:', status, 'Error:', error);
            });
        }
    </script>
</body>
</html>
